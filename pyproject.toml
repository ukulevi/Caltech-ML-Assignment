[project]
name = "caltech-ml-assignment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "h5py>=3.12",
  "ipykernel>=6.29",
  "joblib>=1.4",
  "jupyterlab>=4.5.7",
  "kagglehub>=0.3",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "pillow>=10.4",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
  "torch>=2.7",
  "torchvision>=0.22",
  "tqdm>=4.66",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
